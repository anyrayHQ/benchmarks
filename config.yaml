# Anyray Optimizer Benchmarks — configuration
#
# Mirrors the layout of a dataset benchmark suite: a `shared` block that applies
# to every suite, then a `benchmarks` map (one entry per suite directory). Each
# suite lists its workloads; each workload names the optimizer strategy and the
# single knob it runs at.
#
# The harness turns each workload into two configs:
#   control     — optimizer bypassed (the raw request; establishes the baseline)
#   optimized   — the strategy below, at its knob (what Anyray actually sends)
# This is the Anyray analog of a compression benchmark's `control` vs
# `model--aggressiveness` configs.

shared:
  # A running Anyray optimizer (the before-request hook). `docker compose up` in
  # the Anyray stack exposes it in-network on :8088; point the harness at it.
  optimizer_url: "http://localhost:8088"
  # Admin token for the optimizer's /admin/optimizer/settings API. The harness
  # PUTs a single-strategy config per workload to isolate the hero strategy
  # (the same key gates the console). Read from $ANYRAY_ADMIN_TOKEN if unset.
  admin_token_env: "ANYRAY_ADMIN_TOKEN"
  # Hook token, only used if the optimizer sets ANYRAY_OPTIMIZER_TOKEN (hardened
  # deployments). Read from $ANYRAY_OPTIMIZER_TOKEN; leave blank for a dev optimizer.
  optimizer_token_env: "ANYRAY_OPTIMIZER_TOKEN"
  endpoint: "/v1/chat/completions"
  # Token accounting basis for the default (accounting) mode: whole-request
  # characters / chars_per_token. 4 matches the optimizer's own estimate and the
  # demo scorer. This is an estimate, not a provider bill (see RESULTS.md).
  chars_per_token: 4
  # Per-request safety: never let the harness wait forever on the hook.
  request_timeout_ms: 30000

# Live validation (run_live.mjs): executes baseline vs optimized requests against the
# gateway and judges answer-vs-answer quality. `model` must be one the gateway serves;
# overridden by $ANYRAY_LIVE_MODEL. Judge defaults to the same gateway (subscription).
live:
  gateway_url: "http://localhost:8787"
  # claude-opus-4-8 is the real production hero — ~74% of deployed traffic.
  model: "claude-opus-4-8"
  judge_model: "claude-opus-4-8"
  temperature: 0

# Verdict thresholds (lib/verdict.mjs): a strategy is WORKING if median real saved >=
# minSavedPct with no quality FAIL (MARGINAL within allowMarginal); TUNE if a sweep knob
# recovers PASS; REWORK otherwise or if savings are negligible.
verdict:
  minSavedPct: 20         # WORKING needs at least this real median saving
  allowMarginal: 0        # MARGINAL workloads tolerated before a strategy drops out of WORKING
  negligibleSavedPct: 5   # below this, a no-fail strategy earns ~nothing -> REWORK/replace

# Knob sweeps (run_live.mjs --mode sweep): for each value, re-run the workload at that
# knob and record the savings<->quality point. Used to recommend a tuned knob.
sweep:
  relevance_filter: { param: keepChars, values: [1500, 3000, 6000, 12000, 32000] }
  context_compression: { param: maxArrayItems, values: [50, 200, 500] }
  code_graph: { param: minBodyLines, values: [2, 4, 8] }
  window_budget: { param: maxTokens, values: [700, 2500, 24000, 100000] }
  prompt_compression: { param: minChars, values: [200, 400, 800] }

# One entry per suite directory. `strategy` + `params` are passed verbatim to
# /admin/optimizer/settings so only that strategy runs at that knob.
benchmarks:

  logs-and-data:
    title: "Logs & structured data"
    blurb: >-
      A big log or data blob pasted into one turn, with a narrow question. The
      lexical relevance filter keeps the lines that answer it; the JSON crusher
      minifies and array-caps oversized tool data.
    workloads:
      - id: "1-access-log"
        title: 'Access log (500 requests) — "find the failing requests"'
        strategy: "relevance_filter"
        # Swept on v0.3.24: keepChars=3000 keeps the failing-request lines + window + IPs
        # at 96% and clears the Opus-4.8 judge (1500/98% was judge-MARGINAL — too tight).
        params: { keepChars: 3000, roles: ["user"] }
      - id: "2-sre-incident"
        title: 'SRE incident — "why did checkout p99 spike at 10:05?"'
        strategy: "relevance_filter"
        # keepChars=12000 keeps the answer (root-cause lines survive); the old 1000
        # was an unfair knob that kept <1% of a 26k-token input and dropped the answer.
        params: { keepChars: 12000, roles: ["user"] }
      - id: "33-synonym-gap-logs"
        title: 'Synonym-gap logs — "find the resource-exhaustion event" (OOM/cgroup)'
        strategy: "relevance_filter"
        # Synonym gap: query says "resource exhaustion"/"capacity saturation"; answer
        # lines say "OOM killer"/"heap exhaustion"/"cgroup". semanticWeight=0.7 surfaces
        # the OOMKilled block lexical BM25 misses; keepChars=3000 keeps all 4 facts at 60%.
        params: { keepChars: 3000, roles: ["user"], semanticRerank: true, semanticWeight: 0.7 }
      - id: "4-json-array"
        title: 'JSON array (500 items) — "which orders failed and why?"'
        strategy: "context_compression"
        params: { roles: ["user"] }
      - id: "29-orders-json"
        title: 'Orders dump (tool result) — "which orders failed and why?"'
        strategy: "context_compression"
        params: {}
      - id: "30-metrics-json"
        title: 'Metrics series (tool result) — "find the latency spike"'
        strategy: "context_compression"
        params: {}

  code-context:
    title: "Code context"
    blurb: >-
      An agent reads source, search hits, or a diff back into the window. The
      code-aware strategies keep the navigable skeleton (or the on-path
      reference graph) and elide the bodies that don't matter to the question.
    workloads:
      - id: "5-code-search"
        title: 'Code search (100 hits) — "where is the retry policy configured?"'
        strategy: "relevance_filter"
        # keepChars=8000 keeps the definition line (file path + RETRY_MAX) alongside the
        # use sites, so the answer survives the rank-and-trim (55% on v0.3.24).
        params: { keepChars: 8000, roles: ["user"] }
      - id: "6-git-diff"
        title: 'Git diff — "any risky change in this PR?"'
        # relevance_filter ranked the loosened-auth hunk below larger hunks (a FAIL);
        # context_compression keeps every hunk structurally, so the auth change survives.
        strategy: "context_compression"
        params: { roles: ["user"] }
      - id: "7-codebase-explore"
        title: 'Codebase exploration — "explain the architecture & where retries live"'
        # code_skeleton is retired in v0.3.24 (mutually exclusive with code_graph, rejected);
        # code_graph is what production runs for code reads.
        strategy: "code_graph"
        params: { minChars: 200, minBodyLines: 2, roles: ["user"] }
      - id: "15-multifile-graph"
        title: 'Multi-file trace — "how does Checkout.submitOrder capture payment?"'
        strategy: "code_graph"
        params: { minChars: 200, minBodyLines: 2 }
      - id: "17-python-multifile"
        title: 'Multi-file trace (Python) — "how does Checkout.submit_order capture payment?"'
        strategy: "code_graph"
        params: { minChars: 200, minBodyLines: 2 }
      - id: "27-read-service-ts"
        title: "Read a large TS service file (tool result) — keep the on-path bodies"
        strategy: "code_graph"
        params: { minChars: 200, minBodyLines: 2 }
      - id: "28-read-module-py"
        title: "Read a Python module (tool result) — keep the on-path bodies"
        strategy: "code_graph"
        params: { minChars: 200, minBodyLines: 2 }

  tools-and-rag:
    title: "Tools & retrieval"
    blurb: >-
      Bloat that rides alongside the prompt: dozens of tool schemas, over-fetched
      RAG chunks, the same instruction block re-pasted per item. Prune the unused
      tools, drop the off-topic chunks, dedup the boilerplate.
    workloads:
      - id: "11-mcp-tools"
        title: "MCP tool bloat — 41 tool schemas ride along, 2 are needed"
        strategy: "tool_pruning"
        params: { keepUnnamed: true }
        qualityCheck: tool_safety
      - id: "12-rag-overfetch"
        title: "RAG over-retrieval — top-20 chunks stuffed, 2 hold the answer"
        strategy: "relevance_filter"
        params: { keepChars: 1200, roles: ["user"] }
      - id: "32-vocab-mismatch-rag"
        title: 'Vocab-mismatch RAG (20 chunks) — "what revokes their credential?"'
        strategy: "relevance_filter"
        # Retrieved chunks ride in a tool message; query ("involuntary disconnections")
        # shares no vocabulary with the answer chunks ("session eviction" / "auth context
        # invalidated"), so semantic rerank — not lexical BM25 — must keep chunks 03 & 06.
        params: { keepChars: 1500, roles: ["tool", "function", "user"], semanticRerank: true, semanticWeight: 0.7 }
      - id: "13-prompt-boilerplate"
        title: "Templated boilerplate — the same instructions re-pasted 40x"
        strategy: "prompt_compression"
        params: { minChars: 400 }
      - id: "23-mcp-schema"
        title: "MCP tool schemas — 41 verbose schemas, compress the prose not the set"
        strategy: "tool_schema_compression"
        params: { collapseWhitespace: true, stripBoilerplate: true }
        qualityCheck: tool_calls
      - id: "42-semantic-rerank-rag"
        title: 'Cost-cutting synonyms RAG (14 docs) — "lower the cloud bill" vs "infrastructure spend"'
        strategy: "relevance_filter"
        # Third vocab-mismatch scenario: the lexical trap doc ("Cloud bill anomaly alerts")
        # matches the query wording but not the intent; the answer docs (rightsizing /
        # committed-use / egress) win only under semantic rerank.
        params: { keepChars: 1500, roles: ["tool", "function", "user"], semanticRerank: true, semanticWeight: 0.7 }

  agent-ops:
    title: "Agent operations"
    blurb: >-
      The long-running agent's everyday waste: a triage dump, a session that
      overflows the window, a test run read back verbatim. Filter, fit-to-budget,
      and digest the command output to its failures.
    workloads:
      - id: "3-github-triage"
        title: 'GitHub triage — "which open issues are P0 auth bugs?"'
        strategy: "relevance_filter"
        params: { keepChars: 2000, roles: ["user"] }
      - id: "8-long-session"
        title: "Long agent session — keep a 60-message session inside the window"
        strategy: "window_budget"
        # maxTokens=8000 keeps the leading turn + the recent turns that hold the final
        # recommendation; swept to 91% with both answer facts intact on v0.3.24.
        params: { maxTokens: 8000 }
      - id: "16-test-run"
        title: 'Test-suite output — "which tests failed and why?"'
        strategy: "command_digest"
        params: { maxFailures: 10, contextLines: 12, roles: ["user"] }
      - id: "24-agent-toolcalls"
        title: "Agentic tool-call session — fit a multi-step investigation in budget"
        strategy: "window_budget"
        params: { maxTokens: 700 }
      - id: "31-long-toolsession"
        title: "Long tool-call session — fit a 10-file investigation in budget"
        strategy: "window_budget"
        params: { maxTokens: 2500 }
      - id: "34-repeat-reads"
        title: 'Repeated reads — the agent re-reads a file and re-runs git status'
        strategy: "context_dedupe"
        # Byte-identical re-reads sit BEFORE the keepRecentTurns=2 pin (the dup pair is
        # turns 3-4 of 6), so the later copies collapse to pointers at the first copy.
        params: {}
      - id: "35-flaky-test-rerun"
        title: 'Flaky-suite re-run — near-duplicate pytest output collapses to a delta'
        strategy: "context_dedupe"
        # Run 2 differs from run 1 in ~6 of ~120 lines (one failure flips to PASSED,
        # seed/durations change): nearDupe keeps a unified delta against the run-1 anchor,
        # and the flipped PASSED line must survive inside that delta.
        params: {}

  memory-recall:
    title: "Cross-session memory recall"
    blurb: >-
      The "remember this for me" workloads: a large recalled store (past
      sessions, decisions, notes, a back catalogue, a week of activity) rides
      back as a tool message, and a narrow question selects the few records that
      answer it. BM25, lexical, no LLM.
    workloads:
      - id: "18-session-recall"
        title: 'Cross-session catch-up — "catch me up on this branch"'
        strategy: "relevance_filter"
        # The recalled store rides in a tool message, so roles must include tool/function
        # for the filter to fire on v0.3.24 (roles=user alone is a no-op here).
        params: { keepChars: 2500, roles: ["tool", "function", "user"] }
      - id: "36-stale-observations"
        title: 'Stale trajectory — mask old bulky observations, keep errors and fresh turns'
        strategy: "observation_mask"
        # Bulky helm/describe/pods dumps sit 4+ assistant turns back (past keepRecentTurns=3)
        # and mask to retrieval markers; the error-bearing log slice is hard-kept (ERROR_RE),
        # so the root-cause facts stay inline while ~60% of the trajectory externalizes.
        params: {}
      - id: "37-durable-blob"
        title: 'Durable externalization — a 100 KB manifest becomes a retrieval handle'
        strategy: "output_externalize"
        # Requires the durable CCR tier (content key + content mode != off + spend DB) —
        # the strategy self-gates and no-ops without it (see VALIDATION.md). Key facts live
        # OUTSIDE the blob (scan output + assistant summary), which is the point: the blob
        # is wholesale-externalized behind a handle, not summarized.
        params: {}

  guardrails:
    title: "Guardrails (special accounting)"
    blurb: >-
      Workloads whose saving is not whole-request character reduction, so they are
      reported on their own basis: a repeated call served from cache, a pasted
      screenshot swapped for OCR text, a runaway output ceiling clamped, a Claude
      prompt-cache prefix stabilized, and a low-signal context scored for health.
      See the suite README for each basis.
    workloads:
      - id: "9-repeat-request"
        title: "Repeated identical request — 2nd call served from cache"
        strategy: "semantic_cache"
        params: {}
        tier: "cache"
        qualityCheck: cache_hit
      - id: "10-screenshot-ocr"
        title: 'Pasted screenshot — "what is this error and how do I fix it?"'
        strategy: "vision_ocr"
        params: { imageTokenEstimate: 1000 }
        tier: "vision"
        qualityCheck: answer_judge
      - id: "14-runaway-max-tokens"
        title: "Runaway max_tokens — 100k output ceiling on a one-line task"
        strategy: "param_tuning"
        params: { maxTokensCap: 4096 }
        tier: "guardrail"
        qualityCheck: truncation
      - id: "25-claude-cache-prefix"
        title: "Claude prompt-cache prefix — stabilize the system+tools prefix for reuse"
        strategy: "cache_optimizer"
        # Sonnet's real cacheable floor is ~1024 tokens (~4096 chars); the default
        # 5000 carries extra margin. Pin to the floor so the prefix here injects.
        params: { minPrefixChars: 4096 }
        tier: "cache-prefix"
        qualityCheck: identical
      - id: "26-context-quality"
        title: "Context health score — flag a bloated, over-fetched context"
        strategy: "context_quality"
        params: { bloatedToolChars: 1500 }
        tier: "diagnostic"
        qualityCheck: readonly
      - id: "38-anthropic-context-trim"
        title: 'Provider context trim — Anthropic clear_tool_uses annotation, content untouched'
        strategy: "provider_context_trim"
        # Annotation-only: fires on bare claude-* models on /v1/messages past triggerTokens,
        # injecting the native context_management edit. Message bytes must be unchanged —
        # key facts from the EARLIEST tool rounds must survive at 100%.
        endpoint: "/v1/messages"
        params: { triggerTokens: 4000, clearAtLeastTokens: 500 }
        tier: "guardrail"
        qualityCheck: answer_judge
      - id: "39-reasoning-downshift"
        title: 'Reasoning downshift — routine tool-resume turn on a reasoning model'
        strategy: "reasoning_budget"
        # OpenAI lane: a gpt-5-codex resume turn (2 assistant turns, ends on a clean tool
        # result) gains reasoning_effort=low. Needs a session key in metadata to fire.
        # Savings are output-side (thinking tokens), invisible to request-byte accounting.
        metadata: { sessionId: "bench-39-reasoning-downshift" }
        params: {}
        tier: "guardrail"
        qualityCheck: answer_judge
      - id: "40-output-shaping"
        title: 'Output shaping — concise-output advisory appended on a resume turn'
        strategy: "output_shaping"
        # Tail-append only: the "[anyray:output-guidance]" keyfact asserts the advisory
        # fired; the content keyfacts assert nothing else moved. Output-side savings.
        params: {}
        tier: "guardrail"
        qualityCheck: answer_judge
      - id: "41-mixed-content-census"
        title: 'Content census — nine shape classes through a read-only pass'
        strategy: "content_census"
        # Pure measurement: json_array, unified_diff, grep, build log, py/ts source, HTML,
        # base64, prose in one session. The request must pass through byte-identical.
        params: {}
        tier: "diagnostic"
        qualityCheck: readonly
