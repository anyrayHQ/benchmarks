# Anyray end-to-end benchmarks — configuration
#
# Every workload is sent twice, as the same request:
#   direct   — straight to the provider (no Anyray anywhere on the path)
#   gateway  — through an Anyray gateway, exactly as a customer would send it
#              (client key only, no x-anyray-* control headers)
# and the two responses are compared on billed tokens, dollar cost and answer quality.
# Anyray is a black box here: nothing in this repo talks to the optimizer service.

run:
  # Model both sides call. Override with $ANYRAY_LIVE_MODEL.
  model: "claude-sonnet-5"
  # Judges direct-vs-gateway answer equivalence; always called direct, so Anyray is
  # never in the scoring path. Override with $ANYRAY_JUDGE_MODEL.
  judge_model: "claude-opus-4-8"
  # Gateways the harness refuses to call, whatever the env says.
  blocked_gateways:
    - "https://gateway.anyray.ai"
  # The provider for the direct side. Override with $ANYRAY_DIRECT_URL.
  direct_url: "https://api.anthropic.com"
  # There is deliberately NO default gateway URL: set $ANYRAY_GATEWAY_URL (or
  # gateway_url here) so a run never lands on a deployment by accident.
  # gateway_url: "https://your-gateway.example.com"
  #
  # temperature is unset: claude-opus-4-8 rejects it outright. Set it only for models
  # that take it; it is applied to both sides identically.
  # temperature: 0
  #
  # Order the two calls run in. Each side can warm the provider's prompt cache for
  # the other, so the default alternates per workload to cancel that bias out.
  order: "alternate"   # alternate | direct-first | gateway-first
  # Extended-thinking workloads (39) can legitimately run minutes.
  timeout_ms: 300000

# USD per million tokens, used to price each side from the provider's usage block.
# Cache reads bill at cache_read x input, 5-minute cache writes at cache_write x input;
# a model may override cache_read. Anthropic list prices as of 2026-09-28
# (platform.claude.com/docs/en/about-claude/pricing). Unlisted model -> cost: null.
pricing:
  cache_read: 0.1
  cache_write: 1.25     # 5-minute cache writes
  cache_write_1h: 2     # 1-hour cache writes (Claude Code uses these)
  models:
    claude-fable-5-1:  { input: 10, output: 50, cache_read: 0.025 }
    claude-fable-5:    { input: 10, output: 50 }
    claude-opus-5-5:   { input: 4,  output: 20, cache_read: 0.05 }
    claude-opus-5:     { input: 5,  output: 25 }
    claude-opus-4-8:   { input: 5,  output: 25 }
    claude-sonnet-5:   { input: 2,  output: 10 }
    claude-sonnet-4-6: { input: 3,  output: 15 }
    claude-haiku-4-5:  { input: 1,  output: 5 }

# Workloads, grouped by suite directory. Each id is a payload at
# <suite>/payloads/<id>.json and a key-facts rubric in keyfacts.json. `endpoint`
# defaults to the OpenAI-compatible /v1/chat/completions; Anthropic-native payloads
# (thinking blocks, tool_result blocks) set /v1/messages. `skip` names why a workload
# cannot be sent to a real provider; RESULTS.md lists it, the runner never calls it.
benchmarks:

  logs-and-data:
    title: "Logs & structured data"
    workloads:
      - id: "1-access-log"
        title: "Access log (500 requests) — \"find the failing requests\""
      - id: "2-sre-incident"
        title: "SRE incident — \"why did checkout p99 spike at 10:05?\""
      - id: "33-synonym-gap-logs"
        title: "Synonym-gap logs — \"find the resource-exhaustion event\" (OOM/cgroup)"
      - id: "4-json-array"
        title: "JSON array (500 items) — \"which orders failed and why?\""
      - id: "29-orders-json"
        title: "Orders dump (tool result) — \"which orders failed and why?\""
      - id: "30-metrics-json"
        title: "Metrics series (tool result) — \"find the latency spike\""

  code-context:
    title: "Code context"
    workloads:
      - id: "5-code-search"
        title: "Code search (100 hits) — \"where is the retry policy configured?\""
      - id: "6-git-diff"
        title: "Git diff — \"any risky change in this PR?\""
      - id: "7-codebase-explore"
        title: "Codebase exploration — \"explain the architecture & where retries live\""
      - id: "15-multifile-graph"
        title: "Multi-file trace — \"how does Checkout.submitOrder capture payment?\""
      - id: "17-python-multifile"
        title: "Multi-file trace (Python) — \"how does Checkout.submit_order capture payment?\""
      - id: "27-read-service-ts"
        title: "Read a large TS service file (tool result) — keep the on-path bodies"
      - id: "28-read-module-py"
        title: "Read a Python module (tool result) — keep the on-path bodies"

  tools-and-rag:
    title: "Tools & retrieval"
    workloads:
      - id: "11-mcp-tools"
        title: "MCP tool bloat — 41 tool schemas ride along, 2 are needed"
      - id: "12-rag-overfetch"
        title: "RAG over-retrieval — top-20 chunks stuffed, 2 hold the answer"
      - id: "32-vocab-mismatch-rag"
        title: "Vocab-mismatch RAG (20 chunks) — \"what revokes their credential?\""
      - id: "13-prompt-boilerplate"
        title: "Templated boilerplate — the same instructions re-pasted 40x"
      - id: "23-mcp-schema"
        title: "MCP tool schemas — 41 verbose schemas, compress the prose not the set"
      - id: "42-semantic-rerank-rag"
        title: "Cost-cutting synonyms RAG (14 docs) — \"lower the cloud bill\" vs \"infrastructure spend\""

  agent-ops:
    title: "Agent operations"
    workloads:
      - id: "3-github-triage"
        title: "GitHub triage — \"which open issues are P0 auth bugs?\""
      - id: "8-long-session"
        title: "Long agent session — keep a 60-message session inside the window"
      - id: "16-test-run"
        title: "Test-suite output — \"which tests failed and why?\""
      - id: "24-agent-toolcalls"
        title: "Agentic tool-call session — fit a multi-step investigation in budget"
      - id: "31-long-toolsession"
        title: "Long tool-call session — fit a 10-file investigation in budget"
      - id: "34-repeat-reads"
        title: "Repeated reads — the agent re-reads a file and re-runs git status"
      - id: "35-flaky-test-rerun"
        title: "Flaky-suite re-run — near-duplicate pytest output collapses to a delta"
      - id: "43-thinking-replay"
        title: "Replayed reasoning — a resumed agent turn re-sends six signed thinking blocks"
        endpoint: "/v1/messages"
        skip: "replays thinking blocks with synthetic signatures, which a real provider rejects (400 Invalid signature)"

  memory-recall:
    title: "Cross-session memory recall"
    workloads:
      - id: "18-session-recall"
        title: "Cross-session catch-up — \"catch me up on this branch\""
      - id: "36-stale-observations"
        title: "Stale trajectory — mask old bulky observations, keep errors and fresh turns"
        endpoint: "/v1/messages"
      - id: "37-durable-blob"
        title: "Durable externalization — a 100 KB manifest becomes a retrieval handle"

  guardrails:
    title: "Guardrails"
    workloads:
      - id: "9-repeat-request"
        title: "Repeated identical request — 2nd call served from cache"
      - id: "14-runaway-max-tokens"
        title: "Runaway max_tokens — 100k output ceiling on a one-line task"
      - id: "25-claude-cache-prefix"
        title: "Claude prompt-cache prefix — stabilize the system+tools prefix for reuse"
      - id: "26-context-quality"
        title: "Context health score — flag a bloated, over-fetched context"
      - id: "38-anthropic-context-trim"
        title: "Provider context trim — Anthropic clear_tool_uses annotation, content untouched"
        endpoint: "/v1/messages"
      - id: "39-reasoning-downshift"
        title: "Reasoning downshift — routine tool-resume turn on a reasoning model"
        endpoint: "/v1/messages"
        metadata: {"sessionId":"bench-39-reasoning-downshift"}
      - id: "40-output-shaping"
        title: "Output shaping — concise-output advisory appended on a resume turn"
      - id: "41-mixed-content-census"
        title: "Content census — nine shape classes through a read-only pass"
      - id: "44-prefix-churn"
        title: "Prefix churn — the client rewrites its own cached prefix between two turns"
