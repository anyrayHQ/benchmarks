title: "Walk-away session in spf13/cobra — one question, then the user never returns"
# Exercises keep-warm when nobody comes back: the harness waits out the gateway's idle
# window (gatewaySettleSec) before reading the session's pings from the gateway.
repo:
  git: https://github.com/spf13/cobra.git
  ref: adbc8813901bba65827259daa8e22ff94ec1f30e
task: >-
  I'm new to this codebase. Explain how cobra goes from os.Args to running a
  command's Run function: which functions are involved, in which files, and how
  flags are separated from the subcommand path. Cite file names and function names.
gatewaySettleSec: 2100
keyFacts:
  - "ExecuteC"
  - "command.go"
maxTurns: 25
timeoutMin: 8
