title: "Bug fix in spf13/cobra — mutually exclusive flags no longer rejected"
repo:
  git: https://github.com/spf13/cobra.git
  ref: adbc8813901bba65827259daa8e22ff94ec1f30e
# Applied to the checkout before the session: breaks the exclusive-flag-group check.
patch: bug.patch
task: >-
  A user reports that since the last change, cobra no longer rejects commands where two
  flags marked with MarkFlagsMutuallyExclusive are both set: `app --json --yaml` runs
  instead of failing. Find the cause, fix it, and make sure `go test ./...` passes.
# Graded by running this in the session's workdir afterwards: exit 0 = solved.
check: "go test ./..."
# 80, not lower: anyray-connect turns its read hint and Explore decline off under a lower cap
# (CONNECT_WORK_MODE_MIN_TURNS in run_agent.mjs), and production sessions have no cap.
maxTurns: 80
timeoutMin: 6
