title: "Claude Agent SDK security scanner over synthetic recorded traffic + a live fixture"
# A Claude Agent SDK application (settingSources []), not Claude Code and not a plain
# Messages loop: a main agent dispatches three scanner subagents in parallel (the SDK
# `agents` map), each with in-process MCP tools traffic_query (a synthetic recorded-traffic
# SQLite, 20–60 kB rows) and http_get (a local fixture server). Ten vulnerabilities are
# seeded across the two read paths. Grading is findings recall via the harness's
# ReportFindings + answerText contract; the ten keyFacts are the markers each vulnerability
# carries (synthetic by construction). The modelled origin is Novee's scanner (ANY-559).
#
# Arms (set by the runner, not here): A = gateway with x-anyray-harness-retrieval off,
# B = gateway with it on, C = direct Bedrock. All synthetic data; no repo checkout.
task: >-
  Scan a web service for security vulnerabilities across its recorded traffic and live
  endpoints, quoting the exact offending string for each finding.
# Generated by tools/traffic-fixture (deterministic): the SQLite row count and the seed.
fixture:
  rows: 24
  seed: 1337
# The Agent SDK app is cheap per turn on Haiku; the cap bounds a runaway subagent fan-out.
maxTurns: 16
timeoutMin: 10
