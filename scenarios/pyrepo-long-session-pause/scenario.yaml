title: "Long session in a large Python codebase with three 7-minute pauses: three cold turns on a 5-minute cache"
# pyrepo-long-session-cold with the pauses cut to 7 minutes, for API-key and Bedrock arms:
# Claude Code marks those requests with 5-minute cache entries, so each pause still expires
# the cache and the next turn re-writes the whole conversation, in ~1 hour instead of ~4.
# The large file reads before each pause are what a cold-turn trim can remove (ANY-831).
repo:
  git: https://github.com/saltstack/salt.git
  ref: f37cdcd1c93f778a84f83b3cc9933cac92d0456b
task: >-
  I'm new to this codebase. Read salt/loader/lazy.py and explain how LazyLoader finds,
  filters and loads a module, including what __virtual__ does. Cite path:line with the
  path relative to the repository root.
followups:
  - "Now read salt/minion.py around how a job is received and explain the path from the published payload to calling the execution function. Cite path:line with the path relative to the repository root."
  - "Explain how the return gets back to the master and then to the CLI (salt/client/__init__.py). Cite path:line with the path relative to the repository root."
  - "How are the dunder globals (__salt__, __opts__, __grains__) injected into a module? Cite path:line with the path relative to the repository root."
  - "Finally: write one Markdown summary of the whole path from `salt '*' test.ping` to the printed result, with a section per stage, citing path:line for every claim, with the path relative to the repository root."
followupDelaySec: [420, 420, 420, 0]
gatewaySettleSec: 420
citations:
  min: 10
  resolveRate: 0.9
maxTurns: 40
timeoutMin: 90
