title: "Claude Agent SDK code scanner over a large Python codebase (nine seeded vulnerabilities)"
# The sdk-app-scanner application shape (a Claude Agent SDK app, settingSources [], an
# `agents` map, permissionMode bypassPermissions), pointed at SOURCE CODE instead of
# recorded traffic: the main agent dispatches three `auditor` subagents in parallel, one
# per slice of the codebase, and each reads its files with the SDK's built-in Read, Grep
# and Glob (plus the arm's Anyray read tools). That is the read-heavy shape of a scanner
# that audits a customer's repository, the work `anyray_read_batch` is built to cut.
#
# seeded-vulns.patch plants nine vulnerabilities, three per slice, each on a line carrying
# one distinctive identifier or literal that exists nowhere else in the tree (keyFacts).
# The patch is re-imported as a single commit (hidePatch), so neither `git diff` nor
# `git log` points at them. Grading is the harness's keyFacts contract over answerText:
# the final report plus every accepted ReportFindings call, from any agent. A finding
# that quotes its offending line verbatim carries the fact.
#
# Arms (set by the runner, each on its own gateway key): A = harness-retrieval off,
# B = on, C = optimize-off baseline bypass, D = B plus anyray-connect's local stdio MCP
# server (anyray_read_batch). See run_sdk_app.mjs.
repo:
  git: https://github.com/saltstack/salt.git
  ref: f37cdcd1c93f778a84f83b3cc9933cac92d0456b
patch: seeded-vulns.patch
hidePatch: true
task: >-
  Audit three security-sensitive areas of this Python codebase for vulnerabilities,
  reading the code, and report each with its path:line and the offending line of code
  quoted verbatim.
# One subagent per slice. Each must read every listed file in full and follow calls into
# other files where a finding's reachability depends on them.
slices:
  - name: authentication and minion keys
    files:
      - salt/auth/__init__.py
      - salt/auth/pam.py
      - salt/key.py
      - salt/acl/__init__.py
  - name: file serving and fetching
    files:
      - salt/fileserver/roots.py
      - salt/fileclient.py
      - salt/utils/url.py
  - name: the REST API
    files:
      - salt/netapi/__init__.py
      - salt/netapi/rest_tornado/saltnado.py
      - salt/netapi/rest_cherrypy/app.py
# The text a correct finding quotes, one per seeded vulnerability (case-sensitive, as
# run_agent.mjs grades keyFacts). None occurs in the unpatched tree.
keyFacts:
  - "break_glass"
  - "_LEGACY_INTEROP_KEYSIZE"
  - "_PAM_SERVICE_ACCOUNTS"
  - "_LEGACY_ROOT_PREFIX"
  - "_INSECURE_MIRROR_HOSTS"
  - "_PLAINTEXT_AUTH_SUFFIX"
  - "_TRUSTED_LOCAL_CLIENTS"
  - "saltnado issued session"
  - "_UNAUTHENTICATED_PREFIX"
# Main-agent turns (dispatch, wait, report) and each subagent's own cap; the subagent cap
# bounds a runaway reader without cutting a normal audit of its slice short.
maxTurns: 16
subagentMaxTurns: 60
timeoutMin: 15
