title: "Codebase question in a large Python codebase — how an execution module gets loaded"
repo:
  git: https://github.com/saltstack/salt.git
  ref: f37cdcd1c93f778a84f83b3cc9933cac92d0456b
task: >-
  I'm new to this codebase. Explain how salt decides which execution modules are
  available on a minion and loads one on first use: which classes and functions are
  involved, in which files, and what the __virtual__ function and __virtualname__ do.
  Cite file names and function names.
# Graded by the answer containing each of these.
keyFacts:
  - "LazyLoader"
  - "__virtual__"
  - "__virtualname__"
  - "lazy.py"
  - "minion_mods"
# 80, not lower: anyray-connect turns its read hint and Explore decline off under a lower cap
# (CONNECT_WORK_MODE_MIN_TURNS in run_agent.mjs), and production sessions have no cap.
maxTurns: 80
timeoutMin: 8
