name: main health

# Why this exists: on 2026-07-21 a docs PR merged with `verify` already failing
# (only `gitleaks` was a required check), and main stayed red for 18 days because
# a failing push notifies nobody. A red main is not cosmetic here — it blocks every
# security merge, so Dependabot's js-yaml fix (2 high advisories) sat unmergeable
# for 21 hours behind an unrelated README assertion.
#
# `verify` is now a required status check, which closes the merge path. This closes
# what required checks cannot: admin bypass, direct pushes to main, and a PR that
# was green against a stale base (required checks are not strict).
#
# One issue is kept open while main is red, and closed automatically when it
# recovers — so the signal is a single actionable item, not a stream of noise.
#
# Injection safety: no untrusted field is ever passed through a `${{ }}` expansion
# into a shell. The commit subject is read as a JS value inside github-script and
# sanitized before it is embedded in issue markdown.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: main-health
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABEL = 'main-red';
            const TITLE = 'main is red — `ci` is failing';
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // Only push/dispatch/schedule runs describe the state of main itself.
            // Cancelled and skipped runs say nothing about health — ignore them so
            // a cancelled run never closes a genuine red issue.
            if (!['push', 'workflow_dispatch', 'schedule'].includes(run.event)) return;
            const red = ['failure', 'timed_out'].includes(run.conclusion);
            const green = run.conclusion === 'success';
            if (!red && !green) return;

            // Attacker-controllable text: strip markdown/HTML actives and truncate
            // before embedding. It is display context only, never a shell argument.
            const subject = (run.head_commit?.message ?? '')
              .split('\n')[0].replace(/[`<>\[\]]/g, '').slice(0, 120).trim() || '(no message)';
            const where = `${run.html_url}\nCommit ${run.head_sha.slice(0, 8)} — ${subject}`;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL, per_page: 1,
            });
            const existing = open.data[0];

            if (green) {
              if (!existing) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Recovered — \`ci\` passed on main.\n\n${where}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
              });
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Still red — \`ci\` failed again on main.\n\n${where}`,
              });
              return;
            }

            // Create the label on first use so the workflow is self-installing.
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'b60205',
                description: 'main is failing CI — blocks security merges',
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = already exists
            }

            await github.rest.issues.create({
              owner, repo, title: TITLE, labels: [LABEL],
              body: [
                '`ci` is failing on `main`.',
                '',
                where,
                '',
                '**This blocks security merges.** Dependabot PRs cannot go green while',
                'main is red, so patches queue up silently behind an unrelated failure.',
                'Fix main first, then rebase the blocked PRs (`@dependabot rebase`).',
                '',
                'This issue closes itself when `ci` next passes on main.',
              ].join('\n'),
            });
